<!-- Load errors (scripts, stylesheets, exceptions) are collected from the very start and
     shown on the page by harness.js. Capture phase: resource errors do not bubble. -->
<script>
  window.PX_HARNESS_ERRORS = [];
  window.addEventListener('error', function (e) {
    var t = e && e.target, src = t && (t.src || t.href);
    window.PX_HARNESS_ERRORS.push(src && t !== window ? 'could not load ' + src : (e.message || 'error') + (e.filename ? ' (' + e.filename.split('/').slice(-3).join('/') + ':' + e.lineno + ')' : ''));
    if (window.PX_HARNESS_SHOW) window.PX_HARNESS_SHOW();
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    window.PX_HARNESS_ERRORS.push('unhandled rejection: ' + (e.reason && e.reason.message || e.reason));
    if (window.PX_HARNESS_SHOW) window.PX_HARNESS_SHOW();
  });
</script>
